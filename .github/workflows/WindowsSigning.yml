name: Windows Sign Binaries

on:
  workflow_dispatch:
  release:
    types:
      - published
      - prereleased

permissions:
  contents: write

concurrency:
  group: windows-sign-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell
    working-directory: run

jobs:
  build_and_test:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        odbc_provider: [MDAC]
        build_type: [Release]
        architecture: [x64]
        wsl_distribution: [Ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Create directories
      working-directory: ${{ github.workspace }}
      run: |
        new-item ${{ github.workspace }}\run -itemtype directory
        new-item ${{ github.workspace }}\build -itemtype directory
        new-item ${{ github.workspace }}\prefix -itemtype directory
        new-item ${{ github.workspace }}\install -itemtype directory
        new-item ${{ github.workspace }}\package -itemtype directory

    - name: Clone the repo
      uses: actions/checkout@v4
      with:
        path: source
        submodules: true

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: ${{ matrix.architecture }}

    - name: Configure with CMake
      run: >
        cmake -S ${{ github.workspace }}/source -B ${{ github.workspace }}/build
        -A ${{ fromJSON('{"x86": "Win32", "x64": "x64"}')[matrix.architecture] }}
        -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DODBC_PROVIDER=${{ matrix.odbc_provider }}
        -DTEST_DSN_LIST="ClickHouse DSN ANSI;ClickHouse DSN Unicode"
        -DBUILD_TESTING=NO

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }}

    - name: Package
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --target package

    - name: Create pkcs11properties.cfg file
      run: |
        $content = @"
        name=signingmanager
        library="C:\\Program Files\\DigiCert\\DigiCert Keylocker Tools\\smpkcs11.dll"
        slotListIndex=0
        "@

        Write-Host "Writing pkcs11properties.cfg file"
        $content | Out-File -FilePath ${{ github.workspace }}\run\pkcs11properties.cfg -Encoding ASCII
        Get-Content ${{ github.workspace }}\run\pkcs11properties.cfg

    - name: Create signing certificate
      run: |
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}\run\Certificate_pkcs12.p12", [System.Convert]::FromBase64String("${{ secrets.SM_CLIENT_CERT_FILE_B64 }}"))

    - name: Download Keylocker tools
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
      run: >
        Invoke-WebRequest
        https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download
        -H @{"x-api-key" = $env:SM_API_KEY}
        -o Keylockertools-windows-x64.msi

    - name: Install Keylocker tools
      run: |
        Start-Process msiexec.exe -ArgumentList '/i Keylockertools-windows-x64.msi /passive /quiet /norestart' -Wait

    - name: Check Keylocker tools
      run: |
        & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" --version

    - name: Sync the certificates
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        PKCS11_CONFIG: "${{ github.workspace }}\\run\\pkcs11properties.cfg"
        SM_CLIENT_CERT_FILE: "${{ github.workspace }}\\run\\Certificate_pkcs12.p12"
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_HOST: ${{ secrets.SM_HOST }}
        SM_TLS_SKIP_VERIFY: false
        DIGICERT_KEY_ALIAS: ${{ secrets.DIGICERT_KEY_ALIAS }}
        SM_LOG_LEVEL: TRACE
      run: >
        & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" windows certsync

    - name: Check the installer
      run: |
          ls (Get-ChildItem -Path "${{ github.workspace }}/build" -Filter "clickhouse-odbc-*.msi" | Select-Object -First 1).FullName

    - name: Sign the installer
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        PKCS11_CONFIG: "${{ github.workspace }}\\run\\pkcs11properties.cfg"
        SM_CLIENT_CERT_FILE: "${{ github.workspace }}\\run\\Certificate_pkcs12.p12"
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_HOST: ${{ secrets.SM_HOST }}
        SM_TLS_SKIP_VERIFY: false
        DIGICERT_KEY_ALIAS: ${{ secrets.DIGICERT_KEY_ALIAS }}
        SM_LOG_LEVEL: TRACE
      run: >
        & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" sign
        --fingerprint ${{ secrets.DIGICERT_FINGERPRINT }}
        --input (Get-ChildItem -Path "${{ github.workspace }}/build" -Filter "clickhouse-odbc-*.msi" | Select-Object -First 1).FullName

    # Build a zip archive for manual (non-MSI) installation. The payload is extracted from the signed MSI
    # via an administrative install, so the zip ships exactly the same binaries as the installer.
    - name: Create manual-install zip
      run: |
        $msi = Get-ChildItem -Path "${{ github.workspace }}\build" -Filter "clickhouse-odbc-*.msi" | Select-Object -First 1
        if (-not $msi) { throw "MSI package not found" }

        $versionMatch = Select-String -Path "${{ github.workspace }}\build\CMakeCache.txt" -Pattern '^CMAKE_PROJECT_VERSION:\w+=(.+)$' | Select-Object -First 1
        if (-not $versionMatch) { throw "CMAKE_PROJECT_VERSION not found in CMakeCache.txt" }
        $version = $versionMatch.Matches[0].Groups[1].Value.Trim()

        $extractDir = "${{ github.workspace }}\run\msi-extract"
        $stagingDir = "${{ github.workspace }}\run\zip-staging"
        $templateDir = "${{ github.workspace }}\source\packaging\windows-zip"
        $zipPath = "${{ github.workspace }}\package\$($msi.BaseName)-manual-install.zip"

        # Administrative install only unpacks the files, it does not register anything on the runner.
        $proc = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extractDir`"" -Wait -PassThru
        if ($proc.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($proc.ExitCode)" }

        $driverDll = Get-ChildItem -Path $extractDir -Recurse -Filter "clickhouseodbc.dll" | Select-Object -First 1
        if (-not $driverDll) { throw "clickhouseodbc.dll not found in the extracted MSI" }

        New-Item -ItemType Directory -Path "$stagingDir\bin" -Force | Out-Null
        Copy-Item -Path "$($driverDll.DirectoryName)\*.dll" -Destination "$stagingDir\bin"
        foreach ($required in @("clickhouseodbc.dll", "clickhouseodbcw.dll")) {
          if (-not (Test-Path "$stagingDir\bin\$required")) { throw "$required is missing from the package" }
        }

        # Normalize line endings to CRLF and write the text files without BOM.
        $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
        $install = [System.IO.File]::ReadAllText("$templateDir\INSTALL.md", $utf8NoBom).Replace("@VERSION@", $version)
        $install = ($install -replace "`r?`n", "`r`n")
        [System.IO.File]::WriteAllText("$stagingDir\INSTALL.md", $install, $utf8NoBom)
        $reg = [System.IO.File]::ReadAllText("$templateDir\clickhouse-odbc.reg", $utf8NoBom)
        $reg = ($reg -replace "`r?`n", "`r`n")
        [System.IO.File]::WriteAllText("$stagingDir\clickhouse-odbc.reg", $reg, [System.Text.Encoding]::ASCII)

        # SHA256SUMS in the `sha256sum -c` compatible format.
        $sums = Get-ChildItem -Path $stagingDir -Recurse -File | Sort-Object FullName | ForEach-Object {
          $relative = $_.FullName.Substring($stagingDir.Length + 1).Replace("\", "/")
          "$((Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower())  ./$relative"
        }
        [System.IO.File]::WriteAllText("$stagingDir\SHA256SUMS", (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)

        # ZipFile (unlike Compress-Archive in Windows PowerShell 5.1) uses forward slashes in entry names,
        # so the archive can be extracted correctly on any platform.
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        if (Test-Path $zipPath) { Remove-Item $zipPath }
        [System.IO.Compression.ZipFile]::CreateFromDirectory($stagingDir, $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $false)

        Write-Host "Created $zipPath"
        Get-Content "$stagingDir\SHA256SUMS"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
          name: clickhouse-odbc-windows-${{ matrix.architecture }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/build/clickhouse-odbc-*

    - name: Upload manual-install zip artifact
      uses: actions/upload-artifact@v4
      with:
          name: clickhouse-odbc-windows-${{ matrix.architecture }}-${{ matrix.build_type }}-manual-install
          path: ${{ github.workspace }}/package/clickhouse-odbc-*-manual-install.zip

    - name: Upload artifacts as release assets
      if: ${{ github.event_name == 'release' && matrix.build_type == 'Release' }}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/build/clickhouse-odbc-*.msi
        overwrite: true
        tag: ${{ github.ref }}
        file_glob: true

    - name: Upload manual-install zip as release asset
      if: ${{ github.event_name == 'release' && matrix.build_type == 'Release' }}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/package/clickhouse-odbc-*-manual-install.zip
        overwrite: true
        tag: ${{ github.ref }}
        file_glob: true

